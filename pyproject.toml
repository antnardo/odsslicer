[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "odsslicer"
dynamic = ["version"]
description = "A numpy-style reader/writer for .ods (OpenDocument Spreadsheet) files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anto", email = "antonin.marchand@normalesup.org" }]
requires-python = ">=3.10"
keywords = ["ods", "odf", "opendocument", "spreadsheet", "libreoffice", "openoffice", "calc", "numpy"]
dependencies = [
    "beautifulsoup4>=4.13",
    "lxml>=4.6",
    "numpy>=1.20",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/antnardo/odsslicer"
Documentation = "https://github.com/antnardo/odsslicer/blob/master/DOCS.md"
Repository = "https://github.com/antnardo/odsslicer"
Issues = "https://github.com/antnardo/odsslicer/issues"

[project.optional-dependencies]
# ruff pinned to a minor version: its formatting style only changes between minors, and
# CI checks the format
test = ["pytest", "ruff>=0.16,<0.17"]
typecheck = ["mypy", "types-beautifulsoup4", "lxml-stubs"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the minimal blank-document template used by ODSReader.new()
odsslicer = ["_template.ods", "py.typed"]

[tool.setuptools_scm]
# version is derived from git tags (e.g. tag "v0.1.0" -> package version "0.1.0")
tag_regex = "^v(?P<version>.*)$"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# no python_version pin: numpy's stubs use 3.12+ `type` statements, which mypy
# refuses to parse under an older target grammar - 3.10 compatibility of the
# code itself is covered by the CI test matrix
files = ["src/odsslicer"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
# The prose in docstrings and the XML attribute names both run long; 110 is what
# the code was written to, and what reportlab_layout next door uses.
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unicode look-alikes: the prose uses typographic dashes

