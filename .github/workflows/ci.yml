name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so setuptools-scm can see tags

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package with test dependencies
        run: pip install -e ".[test]"

      - name: Run the test suite
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package with test dependencies (ruff among them)
        run: pip install -e ".[test]"
      # The rules live in pyproject.toml. Checked here because a configuration
      # nobody enforces drifts: between its arrival and this job, the code had
      # collected 506 findings against it.
      - name: ruff (the rules the project selected)
        run: ruff check src tests benchmarks
      - name: ruff format (the code is formatted by ruff, as the repository's convention says)
        run: ruff format --check src tests benchmarks

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package with the type-checking tools
        run: pip install -e ".[typecheck]"
      - name: mypy (all signatures annotated, no type errors)
        run: mypy

  # The strongest tests in the repo hand files odsslicer wrote to a real
  # LibreOffice and inspect what it made of them (tests/
  # test_libreoffice_consistency.py) - they skip automatically when soffice
  # isn't installed, so the matrix job above never exercises them. This job
  # installs LibreOffice and runs the whole suite with them active, on a
  # different OS and LibreOffice version than the development machine.
  test-libreoffice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so setuptools-scm can see tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install LibreOffice (current, from the official PPA)
        # Two Ubuntu specifics:
        # - libreoffice-script-provider-python is Ubuntu's separate package
        #   for LibreOffice's Python scripting framework, which recalculate()
        #   runs its script through.
        # - Ubuntu 24.04's stock LibreOffice 24.2 crashes with std::bad_alloc
        #   in that scripting framework before user code even runs (verified
        #   with a minimal no-op script under several environments), so the
        #   job installs the current LibreOffice from the official PPA
        #   instead - the line the library is developed against.
        run: |
          sudo add-apt-repository -y ppa:libreoffice/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-calc libreoffice-script-provider-python
          soffice --version

      # A number format that names its days and months without saying in which
      # language, and the decimal separator of a displayed time, are rendered by
      # LibreOffice in its own locale - not the document's. The consistency tests
      # compare those strings to what odsslicer wrote, so the locale has to be
      # the same here as where they were written, or "dim. 27 sept." comes back
      # as "Sun 27 Sep". Pinned rather than asserted loosely, so the test keeps
      # checking that both agree character for character.
      #
      # The locale only: no language pack, deliberately. Formats follow the
      # locale, error names follow the interface language, and the tests expect
      # English ones - "#REF!", "Err:540". Installing libreoffice-l10n-fr turned
      # those into "#RÉF !" and "Err :540" and failed three tests, which is what
      # the development machine looks like: French locale, English LibreOffice.
      - name: Use the locale the consistency tests were written in
        run: |
          sudo locale-gen fr_FR.UTF-8
          sudo update-locale LANG=fr_FR.UTF-8
          echo "LANG=fr_FR.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=fr_FR.UTF-8" >> "$GITHUB_ENV"

      - name: Install the package with test dependencies
        run: pip install -e ".[test]"

      - name: Run the test suite (LibreOffice consistency tests active)
        run: |
          pytest -v tests/test_libreoffice_consistency.py
          pytest -q
