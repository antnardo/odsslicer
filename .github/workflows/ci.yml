name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so setuptools-scm can see tags

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with test dependencies
        run: pip install -e ".[test]"

      - name: Run the test suite
        run: pytest

  # The strongest tests in the repo hand files odsslicer wrote to a real
  # LibreOffice and inspect what it made of them (tests/
  # test_libreoffice_consistency.py) - they skip automatically when soffice
  # isn't installed, so the matrix job above never exercises them. This job
  # installs LibreOffice and runs the whole suite with them active, on a
  # different OS and LibreOffice version than the development machine.
  test-libreoffice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so setuptools-scm can see tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreOffice
        # libreoffice-script-provider-python is Ubuntu's separate package for
        # LibreOffice's Python scripting framework, which recalculate() runs
        # its script through - without it the vnd.sun.star.script: URL is
        # silently ignored and the recalculation tests fail.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc libreoffice-script-provider-python
          soffice --version

      - name: Install the package with test dependencies
        run: pip install -e ".[test]"

      - name: Diagnostics (locate the script-provider crash)
        run: |
          python - <<'PY'
          import os, subprocess, tempfile, pathlib, sys

          SCRIPT_MIN = "def hello(*a):\n    open('/tmp/lo_probe_min.txt','w').write('ok')\ng_exportedScripts=(hello,)\n"
          SCRIPT_UNO = (
              "import uno\n"
              "def hello(*a):\n"
              "    ctx = XSCRIPTCONTEXT.getComponentContext()\n"
              "    d = ctx.ServiceManager.createInstanceWithContext('com.sun.star.frame.Desktop', ctx)\n"
              "    open('/tmp/lo_probe_uno.txt','w').write(str(d is not None))\n"
              "g_exportedScripts=(hello,)\n"
          )

          def run(label, script, minimal_env=False, sal_log=False):
              tmp = tempfile.mkdtemp()
              profile = pathlib.Path(tmp) / "profile"
              sp = profile / "user" / "Scripts" / "python"
              sp.mkdir(parents=True)
              (sp / "probe.py").write_text(script)
              if minimal_env:
                  env = {"PATH": os.environ["PATH"], "HOME": os.environ["HOME"], "LANG": "C.UTF-8"}
              else:
                  env = dict(os.environ)
                  for v in ("LD_LIBRARY_PATH", "PYTHONPATH", "PYTHONHOME"):
                      env.pop(v, None)
              if sal_log:
                  env["SAL_LOG"] = "+WARN"
              cmd = ["soffice", "--headless", "--norestore", "--nologo", "--nodefault",
                     f"-env:UserInstallation={profile.as_uri()}",
                     "vnd.sun.star.script:probe.py$hello?language=Python&location=user"]
              r = subprocess.run(cmd, env=env, capture_output=True, text=True, timeout=120)
              print(f"== {label}: rc={r.returncode}")
              tail = (r.stderr or "").strip().splitlines()[-6:]
              for line in tail: print("   ", line)
              for f in ("/tmp/lo_probe_min.txt", "/tmp/lo_probe_uno.txt"):
                  if os.path.exists(f):
                      print("    marker:", f, open(f).read()); os.remove(f)
              sys.stdout.flush()

          run("A. minimal script (no uno import), scrubbed env", SCRIPT_MIN)
          run("B. minimal script, fully minimal env", SCRIPT_MIN, minimal_env=True)
          run("C. uno + Desktop (no document load), scrubbed env", SCRIPT_UNO)
          run("D. minimal script, scrubbed env, SAL_LOG", SCRIPT_MIN, sal_log=True)
          PY

      - name: Run the test suite (LibreOffice consistency tests active)
        run: |
          pytest -v tests/test_libreoffice_consistency.py
          pytest -q
