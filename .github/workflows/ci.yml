name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so setuptools-scm can see tags

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with test dependencies
        run: pip install -e ".[test]"

      - name: Run the test suite
        run: pytest

  # The strongest tests in the repo hand files odsslicer wrote to a real
  # LibreOffice and inspect what it made of them (tests/
  # test_libreoffice_consistency.py) - they skip automatically when soffice
  # isn't installed, so the matrix job above never exercises them. This job
  # installs LibreOffice and runs the whole suite with them active, on a
  # different OS and LibreOffice version than the development machine.
  test-libreoffice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so setuptools-scm can see tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreOffice (current, from the official PPA)
        # Two Ubuntu specifics:
        # - libreoffice-script-provider-python is Ubuntu's separate package
        #   for LibreOffice's Python scripting framework, which recalculate()
        #   runs its script through.
        # - Ubuntu 24.04's stock LibreOffice 24.2 crashes with std::bad_alloc
        #   in that scripting framework before user code even runs (verified
        #   with a minimal no-op script under several environments), so the
        #   job installs the current LibreOffice from the official PPA
        #   instead - the line the library is developed against.
        run: |
          sudo add-apt-repository -y ppa:libreoffice/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc libreoffice-script-provider-python
          soffice --version

      - name: Install the package with test dependencies
        run: pip install -e ".[test]"

      - name: Diagnostics (embedded-python import trace + Basic fallback)
        run: |
          python - <<'PY'
          import os, subprocess, tempfile, pathlib, sys

          SCRIPT_MIN = "def hello(*a):\n    open('/tmp/lo_probe_min.txt','w').write('ok')\ng_exportedScripts=(hello,)\n"

          def scrubbed():
              env = dict(os.environ)
              for v in ("LD_LIBRARY_PATH", "PYTHONPATH", "PYTHONHOME"):
                  env.pop(v, None)
              return env

          def pyprobe(label, extra_env):
              tmp = tempfile.mkdtemp(); profile = pathlib.Path(tmp) / "profile"
              sp = profile / "user" / "Scripts" / "python"; sp.mkdir(parents=True)
              (sp / "probe.py").write_text(SCRIPT_MIN)
              env = scrubbed(); env.update(extra_env)
              cmd = ["soffice", "--headless", "--norestore", "--nologo", "--nodefault",
                     f"-env:UserInstallation={profile.as_uri()}",
                     "vnd.sun.star.script:probe.py$hello?language=Python&location=user"]
              r = subprocess.run(cmd, env=env, capture_output=True, text=True, timeout=120)
              print(f"===== {label}: rc={r.returncode}")
              err = (r.stderr or "").splitlines()
              interesting = [l for l in err if "import" in l or "Error" in l or "error" in l or "pyuno" in l or "Traceback" in l or "No module" in l]
              for l in (interesting[:40] or err[:15]): print("   ", l)
              print("    marker:", os.path.exists("/tmp/lo_probe_min.txt"))
              if os.path.exists("/tmp/lo_probe_min.txt"): os.remove("/tmp/lo_probe_min.txt")
              sys.stdout.flush()

          pyprobe("A. PYTHONVERBOSE=1", {"PYTHONVERBOSE": "1"})
          pyprobe("B. SAL_LOG pyuno", {"SAL_LOG": "+INFO.pyuno+WARN.pyuno+INFO.scripting+WARN.scripting"})

          # C. Basic macro route (no Python at all)
          tmp = tempfile.mkdtemp(); profile = pathlib.Path(tmp) / "profile"
          basic = profile / "user" / "basic"; std = basic / "Standard"; std.mkdir(parents=True)
          (basic / "script.xlc").write_text('<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE library:libraries PUBLIC "-//OpenOffice.org//DTD OfficeDocument 1.0//EN" "libraries.dtd">\n<library:libraries xmlns:library="http://openoffice.org/2000/library" xmlns:xlink="http://www.w3.org/1999/xlink">\n <library:library library:name="Standard" library:link="false"/>\n</library:libraries>\n')
          (basic / "dialog.xlc").write_text('<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE library:libraries PUBLIC "-//OpenOffice.org//DTD OfficeDocument 1.0//EN" "libraries.dtd">\n<library:libraries xmlns:library="http://openoffice.org/2000/library" xmlns:xlink="http://www.w3.org/1999/xlink">\n <library:library library:name="Standard" library:link="false"/>\n</library:libraries>\n')
          (std / "script.xlb").write_text('<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE library:library PUBLIC "-//OpenOffice.org//DTD OfficeDocument 1.0//EN" "library.dtd">\n<library:library xmlns:library="http://openoffice.org/2000/library" library:name="Standard" library:readonly="false" library:passwordprotected="false">\n <library:element library:name="Module1"/>\n</library:library>\n')
          (std / "dialog.xlb").write_text('<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE library:library PUBLIC "-//OpenOffice.org//DTD OfficeDocument 1.0//EN" "library.dtd">\n<library:library xmlns:library="http://openoffice.org/2000/library" library:name="Standard" library:readonly="false" library:passwordprotected="false"/>\n')
          (std / "Module1.xba").write_text('<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE script:module PUBLIC "-//OpenOffice.org//DTD OfficeDocument 1.0//EN" "module.dtd">\n<script:module xmlns:script="http://openoffice.org/2000/script" script:name="Module1" script:language="StarBasic">\nSub Hello()\n  Open "/tmp/lo_probe_basic.txt" For Output As #1\n  Print #1, "hi"\n  Close #1\nEnd Sub\n</script:module>\n')
          cmd = ["soffice", "--headless", "--norestore", "--nologo", "--nodefault",
                 f"-env:UserInstallation={profile.as_uri()}", "macro:///Standard.Module1.Hello()"]
          r = subprocess.run(cmd, env=scrubbed(), capture_output=True, text=True, timeout=120)
          print(f"===== C. Basic macro: rc={r.returncode}, marker={os.path.exists('/tmp/lo_probe_basic.txt')}")
          for l in (r.stderr or "").splitlines()[:8]: print("   ", l)
          PY

      - name: Run the test suite (LibreOffice consistency tests active)
        run: |
          pytest -v tests/test_libreoffice_consistency.py
          pytest -q
